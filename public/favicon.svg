<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#ef4444" stroke-width="1.5" />
  
  <!-- Subtle inner glow -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

  <!-- Document Sheet with Shadow -->
  <g filter="url(#shadow)">
    <!-- Document Base -->
    <path d="M18 13 C18 11.895 18.895 11 20 11 L37 11 L47 21 L47 51 C47 52.105 46.105 53 45 53 L20 53 C18.895 53 18 52.105 18 51 Z" fill="#ffffff" />
    
    <!-- Folded Corner -->
    <path d="M37 11 L47 21 L38.5 21 C37.672 21 37 20.328 37 19.5 Z" fill="url(#foldGrad)" />
    
    <!-- Document Content Lines -->
    <!-- Red Accent Top Bar / Header Line -->
    <rect x="23" y="18" width="10" height="3" rx="1.5" fill="#dc2626" />
    
    <!-- Text Lines -->
    <rect x="23" y="26" width="18" height="2.5" rx="1.25" fill="#64748b" />
    <rect x="23" y="32" width="18" height="2.5" rx="1.25" fill="#94a3b8" />
    <rect x="23" y="38" width="13" height="2.5" rx="1.25" fill="#94a3b8" />
    
    <!-- Badge / Stamp at bottom right -->
    <circle cx="39" cy="43" r="5.5" fill="#dc2626" />
    <!-- Checkmark / Stylized C inside badge -->
    <path d="M36.5 43 L38.2 44.7 L41.5 41.3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
